[project]
name = "foundit-generation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
    "asyncpg==0.30.0",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.13.3",
    "sqlc-bin==1.31.1.post1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["generation*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
exclude = ["references", "generation/generated"]
