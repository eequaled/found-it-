[project]
name = "foundit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.119.0",
    "uvicorn==0.37.0",
    "asyncpg==0.30.0",
    "pydantic-settings==2.11.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "httpx==0.28.1",
    "ruff==0.13.3",
    "sqlc-bin==1.31.1.post1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
exclude = ["references", "app/db/generated"]
